# deploy do jurisleo: corre quando o ficheiro .github/deploy-trigger.txt muda nesta branch (ou pelo botão "run workflow",
# se este ficheiro estiver na branch principal). nunca corre sozinho a cada push normal.
# usa os segredos do repositório (settings, secrets and variables, actions); nada disto fica no código
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [claude/intelligent-goldberg-s0lmvv]
    paths: ['.github/deploy-trigger.txt']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --run
      - name: build (falha se faltar alguma chave do firebase)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - name: confirmar que a chave foi embebida
        run: |
          grep -q 'AIza' dist/assets/*.js
      - name: guardar a versão que está no ar agora (para saber se há versão nova)
        run: curl -fsS "https://jurisleo-67124.web.app/versao.json?t=$(date +%s)" | jq -r .versao > "$RUNNER_TEMP/versao-antes.txt" || echo none > "$RUNNER_TEMP/versao-antes.txt"
      - name: deploy (regras, índices e hosting)
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@latest deploy --only firestore,hosting --project jurisleo-67124
          rm -f "$RUNNER_TEMP/sa.json"
      - name: avisar o telemóvel da Leonor (só se houver versão nova e ela tiver ligado as notificações)
        continue-on-error: true
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          NOVA=$(jq -r .versao dist/versao.json)
          ANTES=$(cat "$RUNNER_TEMP/versao-antes.txt")
          PUBLICA=$(sed -n "s/.*CHAVE_PUBLICA_PUSH = '\(.*\)';/\1/p" src/data/push.js)
          if [ -z "$PUSH_SUBSCRIPTION" ] || [ -z "$VAPID_PRIVATE_KEY" ] || [ -z "$PUBLICA" ]; then echo "notificações não configuradas, sem aviso"; exit 0; fi
          if [ "$NOVA" = "$ANTES" ]; then echo "mesma versão ($NOVA), sem aviso"; exit 0; fi
          ENDPOINT=$(echo "$PUSH_SUBSCRIPTION" | jq -r .endpoint)
          CHAVE=$(echo "$PUSH_SUBSCRIPTION" | jq -r .keys.p256dh)
          AUTH=$(echo "$PUSH_SUBSCRIPTION" | jq -r .keys.auth)
          npx --yes web-push send-notification \
            --endpoint="$ENDPOINT" --key="$CHAVE" --auth="$AUTH" \
            --payload='{"titulo":"JurisLeo","corpo":"Há uma versão nova do JurisLeo. Abre a app para a atualizares."}' \
            --vapid-subject="https://jurisleo-67124.web.app" --vapid-pubkey="$PUBLICA" --vapid-pvtkey="$VAPID_PRIVATE_KEY"
