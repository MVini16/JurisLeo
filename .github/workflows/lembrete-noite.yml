# lembrete da noite: de segunda a sexta, manda um aviso a lembrar a Leonor de marcar as aulas do dia.
# o texto é sempre o mesmo e não depende de nada que ela tenha registado (não lê os dados dela).
# só funciona se ela tiver ligado as notificações e o segredo PUSH_SUBSCRIPTION existir; sem isso termina sem fazer nada.
name: Lembrete da noite

on:
  schedule:
    - cron: '30 19 * * 1-5'
  workflow_dispatch:

jobs:
  lembrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mandar o lembrete
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          PUBLICA=$(sed -n "s/.*CHAVE_PUBLICA_PUSH = '\(.*\)';/\1/p" src/data/push.js)
          if [ -z "$PUSH_SUBSCRIPTION" ] || [ -z "$VAPID_PRIVATE_KEY" ] || [ -z "$PUBLICA" ]; then echo "notificações não configuradas, sem lembrete"; exit 0; fi
          ENDPOINT=$(echo "$PUSH_SUBSCRIPTION" | jq -r .endpoint)
          CHAVE=$(echo "$PUSH_SUBSCRIPTION" | jq -r .keys.p256dh)
          AUTH=$(echo "$PUSH_SUBSCRIPTION" | jq -r .keys.auth)
          npx --yes web-push send-notification \
            --endpoint="$ENDPOINT" --key="$CHAVE" --auth="$AUTH" \
            --payload='{"titulo":"JurisLeo","corpo":"Já marcaste as aulas de hoje? Abre o calendário e diz como correu.","tag":"lembrete-aulas","url":"/calendario"}' \
            --vapid-subject="https://jurisleo-67124.web.app" --vapid-pubkey="$PUBLICA" --vapid-pvtkey="$VAPID_PRIVATE_KEY"
