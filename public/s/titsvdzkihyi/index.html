<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="theme-color" content="#0d0609" />
  <title>Para ti</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="estilo.css" />
</head>
<body class="bloqueado">
  <canvas id="estrelas" aria-hidden="true"></canvas>
  <div class="luzes" aria-hidden="true"><i></i><i></i></div>
  <div class="granulado" aria-hidden="true"></div>
  <div class="barras" aria-hidden="true"><i id="barraCima"></i><i id="barraBaixo"></i></div>
  <div class="progresso" aria-hidden="true"><i id="barra"></i></div>

  <!-- cortina: um toque para começar (no iphone o som só arranca depois de um toque) -->
  <div class="cortina" id="cortina">
    <div class="cortina__miolo">
      <p class="cortina__texto" id="abertura"></p>
      <button class="botao" id="comecar" type="button">Toca para começar</button>
    </div>
  </div>

  <button class="som" id="som" type="button" aria-pressed="false" aria-label="Ligar ou desligar a música" hidden>♪</button>

  <main id="conteudo">
    <!-- cena 1: o título, que cresce até engolir o ecrã -->
    <section class="cena cena--titulo" id="cenaTitulo">
      <div class="titulo-bloco" id="tituloBloco">
        <p class="pequeno" id="subtitulo">Uma coisa só para ti</p>
        <h1 id="nome"></h1>
        <p class="deslizar">desliza devagar</p>
      </div>
      <div class="luz-varrer" aria-hidden="true"></div>
    </section>

    <!-- cena 2: as frases do dia difícil, uma a uma, no mesmo sítio -->
    <section class="cena cena--linhas" id="cenaDificil"><div class="linhas" id="linhasDificil"></div></section>

    <!-- cena 3: as películas de fotos que deslizam na horizontal (construídas em app.js, uma por parte) -->
    <div id="tiras"></div>

    <!-- cena 4: palavras grandes que sobem de dentro de uma máscara -->
    <section class="cena cena--mascara" id="cenaInterludio"><div class="texto-longo texto-longo--grande" id="interludioTexto"></div></section>

    <section class="cap cap--cartas" id="cartas">
      <h2 class="titulo-cap">Abre quando...</h2>
      <p class="sub-cap">Guarda-as para os dias em que precisares. Cada uma só abre ao toque.</p>
      <ul class="cartas" id="listaCartas"></ul>
      <p class="contador" id="contadorCartas" aria-live="polite"></p>
    </section>

    <!-- cena 5: as razões, uma de cada vez, com um número gigante por trás -->
    <section class="cena cena--razoes" id="cenaRazoes">
      <h2 class="titulo-cap razoes-titulo">Pelo que eu te agradeço</h2>
      <div class="razoes-palco" id="razoesPalco"></div>
    </section>

    <section class="cap cap--carta" id="carta">
      <h2 class="titulo-cap" id="cartaTitulo"></h2>
      <div class="carta-longa" id="cartaLonga"></div>
    </section>

    <!-- cena final: as estrelas juntam-se num coração -->
    <section class="cena cena--final" id="cenaFinal">
      <div class="final-bloco">
        <div class="texto-longo texto-longo--grande" id="finalTexto"></div>
        <p class="assinatura" id="assinatura"></p>
        <button class="botao botao--suave" id="topo" type="button">Voltar ao início</button>
      </div>
    </section>
  </main>

  <audio id="musica" loop preload="none"></audio>
  <script src="gsap.min.js"></script>
  <script src="ScrollTrigger.min.js"></script>
  <script src="conteudo.js"></script>
  <script src="app.js"></script>
</body>
</html>
